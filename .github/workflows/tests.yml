name: Tests
on:
  push:
    branches: ['main']
    paths-ignore: ['**/*.md', 'LICENSE', 'licenses/**', '*.png']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE', 'licenses/**', '*.png']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: PHPStan and PSR-12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, ctype, dom, mbstring, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer quality
  integration:
    name: PHP ${{ matrix.php }} / PostgreSQL ${{ matrix.postgresql }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: ['locked', 'latest', 'lowest']
        postgresql: ['17', '18', '19rc1']
    env:
      COMPOSER_ROOT_VERSION: 0.1.0-beta.4
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: modernorm_test
      PGUSER: postgres
      PGPASSWORD: postgres
      MODERNORM_TEST_REDIS_DSN: redis://127.0.0.1:6379
      MODERNORM_TEST_REDIS_SERVER: redis-server
    services:
      redis:
        image: redis:8.10.3
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: modernorm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, pcntl, ctype, dom, mbstring, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none
      - name: Validate checked-in manifest and lock
        run: composer validate --strict
      - name: Cache Redis 8.10.3 test binary
        id: redis-binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/modernorm-redis/bin
          key: redis-8.10.3-${{ runner.os }}-${{ runner.arch }}-libc-v1
      - name: Build pinned Redis 8.10.3 for recovery checks
        if: steps.redis-binary.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/modernorm-redis/bin"
          curl --fail --location --retry 3 https://codeload.github.com/redis/redis/tar.gz/refs/tags/8.10.3 -o "$RUNNER_TEMP/modernorm-redis/source.tar.gz"
          echo "85ae62e175cc76f638015fa18cb384b549b6808a765425d9e9d47466f69532ea  $RUNNER_TEMP/modernorm-redis/source.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/modernorm-redis/source.tar.gz" -C "$RUNNER_TEMP/modernorm-redis"
          make -C "$RUNNER_TEMP/modernorm-redis/redis-8.10.3" -j2 MALLOC=libc BUILD_TLS=no redis-server
          cp "$RUNNER_TEMP/modernorm-redis/redis-8.10.3/src/redis-server" "$RUNNER_TEMP/modernorm-redis/bin/redis-server"
      - name: Use pinned Redis test binary
        run: |
          echo "$RUNNER_TEMP/modernorm-redis/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/modernorm-redis/bin/redis-server" --version
      - name: Verify Redis version from PATH
        run: |
          redis-server --version
      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install latest allowed dependencies
        if: matrix.dependencies == 'latest'
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Install lowest allowed dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - name: Record PostgreSQL server version
        run: php -r '$pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=modernorm_test", getenv("PGUSER"), getenv("PGPASSWORD")); echo $pdo->query("SHOW server_version")->fetchColumn(), PHP_EOL;'
      - name: Run test suites
        env:
          MODERNORM_L2_SOAK_REPORT: ${{ runner.temp }}/l2-soak.json
          MODERNORM_WORKER_EVIDENCE: ${{ runner.temp }}/worker-context.json
        run: composer test -- --fail-on-skipped
      - name: Clean consumer from release ZIP
        if: matrix.dependencies == 'locked'
        env:
          MODERNORM_RELEASE_DIR: ${{ runner.temp }}/modernorm-release
        run: php tools/release/check-consumer.php
      - name: Reproducible measurements
        if: matrix.dependencies == 'locked' && matrix.php == '8.4'
        run: |
          php benchmarks/statistics.php > "$RUNNER_TEMP/statistics-benchmark.json"
          php benchmarks/batching.php > "$RUNNER_TEMP/batching-benchmark.json"
          php -d memory_limit=1G benchmarks/hydration.php > "$RUNNER_TEMP/hydration-benchmark.json"
          php benchmarks/l2.php > "$RUNNER_TEMP/l2-benchmark.json"
          MODERNORM_BENCH_SIZES=1000 php -d memory_limit=1G benchmarks/bulk.php > "$RUNNER_TEMP/bulk-benchmark.json"
      - run: composer install --no-dev --no-interaction --prefer-dist --no-progress
      - run: php tests/Smoke/runtime.php
      - run: php examples/migration/run.php --test-schema
      - name: Upload release evidence
        if: always() && matrix.dependencies == 'locked'
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-php-${{ matrix.php }}-postgresql-${{ matrix.postgresql }}
          path: |
            ${{ runner.temp }}/modernorm-release/dist/*.zip
            ${{ runner.temp }}/modernorm-release/report.json
            ${{ runner.temp }}/*-benchmark.json
            ${{ runner.temp }}/l2-soak.json
            ${{ runner.temp }}/worker-context.json
          if-no-files-found: ignore
          retention-days: 7
